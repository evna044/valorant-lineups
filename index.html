<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALORANT - Sélection Agent & Map</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <a class="brand" href="index.html">V<span>/</span> SELECT</a>
    <div class="topbar-label">SÉLECTION DU TACTICIEN</div>
</header>

<main class="container">

    <section class="intro">
        <p class="eyebrow">VALORANT STRATEGY TOOL</p>
        <h1>CHOISIS TON <span>AGENT</span> ET TA <span>MAP</span></h1>
        <p class="subtitle">Sélectionne une configuration pour accéder à tes lineups enregistrées.</p>
    </section>

    <!-- SECTION 1 : SELECTION DE L'AGENT -->
    <section class="selection-section">
        <div class="section-heading">
            <h2>1. SÉLECTIONNER UN <span>AGENT / CATÉGORIE</span></h2>
        </div>

        <!-- Filtres par rôle -->
        <div id="roleFilters" class="category-filters">
            <button type="button" class="category-filter filter active" data-role="Tous">TOUS</button>
            <button type="button" class="category-filter filter" data-role="Duelliste">DUELLISTE</button>
            <button type="button" class="category-filter filter" data-role="Initiateur">INITIATEUR</button>
            <button type="button" class="category-filter filter" data-role="Contrôleur">CONTRÔLEUR</button>
            <button type="button" class="category-filter filter" data-role="Sentinelle">SENTINELLE</button>
        </div>

        <div id="agentGrid" class="agents-grid">
            Chargement des agents...
        </div>
        <p id="agentCount" class="subtitle"></p>
        <p id="agentInfo" class="subtitle"></p>
    </section>

    <!-- SECTION 2 : SELECTION DE LA MAP -->
    <section class="selection-section">
        <div class="section-heading">
            <h2>2. SÉLECTIONNER UNE <span>MAP</span></h2>
        </div>

        <div class="map-picker">
            <button type="button" id="mapTrigger" class="validate-button" aria-expanded="false" style="background:#181d24; border:1px solid #383e45; width:100%; text-align:left;">
                <span id="mapTriggerContent">CHOISIR UNE MAP ⌄</span>
            </button>
            <div id="mapMenu" hidden style="margin-top:10px;">
                <div id="mapOptions" class="maps-grid"></div>
            </div>
        </div>
        <p id="mapInfo" class="subtitle" style="margin-top:10px;"></p>
    </section>

    <!-- BOUTON DE CONFIRMATION -->
    <div class="action-container">
        <p id="validationMessage" class="subtitle" style="margin-bottom:10px;">Sélection
